<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Kitchen · Mitki's Cafe</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <img class="logo" src="/logo.png" alt="Mitki's Cafe logo" width="64" height="64" style="width:64px;height:64px">
    <div class="brand">
      <h1 style="font-size:clamp(1.6rem,5vw,2.2rem)">Kitchen</h1>
      <p class="sub">Paid orders appear here as they come in.</p>
    </div>
    <button class="hbtn" id="sound" type="button" aria-pressed="false">Sound off</button>
  </div>
  <div class="tiles" aria-hidden="true"></div>
</header>

<main class="wrap">
  <div class="board-head">
    <h2>Orders</h2>
    <p class="board-note" id="boardNote" role="status" aria-live="polite">Loading orders…</p>
  </div>
  <div class="board" id="board"></div>
  <details class="done" id="doneWrap" hidden>
    <summary id="doneSum">Served and cancelled</summary>
    <div class="list" id="doneList"></div>
    <p class="refundnote">Cancelling an order does not refund the customer. Refund from the Razorpay dashboard, using the payment ID shown on the order.</p>
  </details>
</main>
<script src="/kitchen.js"></script>
</body>
</html>
